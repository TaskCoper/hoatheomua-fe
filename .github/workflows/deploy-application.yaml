name: Deploy Application

on:
  workflow_call:
    inputs:
      profile:
        required: true
        type: string
      actor:
        required: true
        type: string
      repository:
        required: true
        type: string
      run-on:
        required: false
        type: string
        default: self-hosted
      tag:
        required: false
        type: string
        default: demo-latest

jobs:
  deploy-application:
    name: Deploy Application
    runs-on: ${{ inputs['run-on'] }}
    timeout-minutes: 15
    environment: ${{ inputs.profile }}
    concurrency:
      group: deploy-hoatheomua-fe-${{ inputs.profile }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      REGISTRY: ghcr.io/${{ inputs.repository }}
      TAG: ${{ inputs.tag }}
      NETWORK: hoatheomua-network-${{ inputs.profile }}
      API_BASE_URL: ${{ secrets.API_BASE_URL }}
      TASKCOPER_API_BASE_URL: ${{ secrets.TASKCOPER_API_BASE_URL }}
      FILE_BASE_URL: ${{ secrets.FILE_BASE_URL }}
      SITE_URL: ${{ secrets.SITE_URL }}
      GOONG_MAP_API_KEY: ${{ secrets.GOONG_MAP_API_KEY }}
      CLOUDGO_CHANNEL_ID: ${{ secrets.CLOUDGO_CHANNEL_ID }}
      PUBLIC_VIETMAP_API_KEY: ${{ secrets.PUBLIC_VIETMAP_API_KEY }}
      VIETMAP_API_KEY: ${{ secrets.VIETMAP_API_KEY }}
      REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ inputs.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize registry name
        shell: bash
        run: |
          REPO_LOWER=$(echo "${{ inputs.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "REGISTRY=ghcr.io/$REPO_LOWER" >> "$GITHUB_ENV"

      - name: Verify external network
        shell: bash
        run: docker network inspect "$NETWORK" >/dev/null

      - name: Pull new image
        shell: bash
        run: >-
          docker compose -f .docker/compose.yaml
          -p hoatheomua-fe-${{ inputs.profile }}
          --profile "${{ inputs.profile }}" pull

      - name: Deploy new image
        shell: bash
        run: >-
          docker compose -f .docker/compose.yaml
          -p hoatheomua-fe-${{ inputs.profile }}
          --profile "${{ inputs.profile }}" up -d --no-build
          --wait --wait-timeout 120

      - name: Prune old images
        shell: bash
        run: docker image prune -f --filter "until=24h"

      - name: Report deployment
        run: echo "Deployment completed successfully."
