name: Playwright Tests

# Manual only. The suite drives a real browser against a shared remote backend and
# creates real, persistent orders (~11 per browser project per run), so it must never
# fire automatically on a push or a pull request. See COVERAGE-PLAN-v2.md §7.
#
# A nightly `schedule:` trigger is the intended end state, but it is deliberately not
# added yet: the job still lacks E2E_BASE_URL, the E2E_USER_* secrets and a `webServer`
# block, so it cannot pass. Add the schedule together with those.
on:
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm install -g pnpm && pnpm install
      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps
      - name: Run Playwright tests
        run: pnpm exec playwright test
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
