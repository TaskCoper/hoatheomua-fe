name: Build Image

on:
  workflow_call:
    inputs:
      actor:
        required: true
        type: string
      repository:
        required: true
        type: string
      environment:
        required: false
        type: string
        default: demo

jobs:
  build-service-image:
    name: Build Service Image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io/${{ inputs.repository }}
      TAG: ${{ inputs.environment }}-latest
      API_BASE_URL: ${{ secrets.API_BASE_URL }}
      TASKCOPER_API_BASE_URL: ${{ secrets.TASKCOPER_API_BASE_URL }}
      FILE_BASE_URL: ${{ secrets.FILE_BASE_URL }}
      SITE_URL: ${{ secrets.SITE_URL }}
      GOONG_MAP_API_KEY: ${{ secrets.GOONG_MAP_API_KEY }}
      CLOUDGO_CHANNEL_ID: ${{ secrets.CLOUDGO_CHANNEL_ID }}
      PUBLIC_VIETMAP_API_KEY: ${{ secrets.PUBLIC_VIETMAP_API_KEY }}
      VIETMAP_API_KEY: ${{ secrets.VIETMAP_API_KEY }}
      REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ inputs.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize registry name
        shell: bash
        run: |
          REPO_LOWER=$(echo "${{ inputs.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "REGISTRY=ghcr.io/$REPO_LOWER" >> "$GITHUB_ENV"

      - name: Build and push image
        shell: bash
        run: |
          docker compose -f .docker/compose.yaml --profile "${{ inputs.environment }}" build
          docker compose -f .docker/compose.yaml --profile "${{ inputs.environment }}" push
