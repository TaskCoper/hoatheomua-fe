x-hoatheomua-fe-base: &hoatheomua-fe-base
  image: ${REGISTRY}/hoatheomua-fe:${TAG:-latest}
  restart: unless-stopped
  build:
    context: ..
    dockerfile: Dockerfile
    secrets: [sentry_auth_token]
    args:
      API_BASE_URL: ${API_BASE_URL:?API_BASE_URL is required}
      TASKCOPER_API_BASE_URL: ${TASKCOPER_API_BASE_URL:?TASKCOPER_API_BASE_URL is required}
      FILE_BASE_URL: ${FILE_BASE_URL:?FILE_BASE_URL is required}
      SITE_URL: ${SITE_URL:?SITE_URL is required}
      GOONG_MAP_API_KEY: ${GOONG_MAP_API_KEY:?GOONG_MAP_API_KEY is required}
      CLOUDGO_CHANNEL_ID: ${CLOUDGO_CHANNEL_ID:?CLOUDGO_CHANNEL_ID is required}
      PUBLIC_VIETMAP_API_KEY: ${PUBLIC_VIETMAP_API_KEY:?PUBLIC_VIETMAP_API_KEY is required}
      ENABLE_ORDERING: ${ENABLE_ORDERING:-true}
      ENABLE_PAYMENT: ${ENABLE_PAYMENT:-true}
      ENABLE_EXTERNAL_SERVICES: ${ENABLE_EXTERNAL_SERVICES:-true}
      # Optional: Sentry release (commit SHA) and environment. Empty leaves the release unset
      # and the environment on NODE_ENV.
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-}
      # Optional: server-side API calls go straight to the gateway over the Docker
      # network. Empty falls back to the public API_BASE_URL / TASKCOPER_API_BASE_URL.
      API_INTERNAL_BASE_URL: ${API_INTERNAL_BASE_URL:-}
      TASKCOPER_API_INTERNAL_BASE_URL: ${TASKCOPER_API_INTERNAL_BASE_URL:-}
  environment:
    TZ: UTC
    HOSTNAME: 0.0.0.0
    PORT: 3000
    VIETMAP_API_KEY: ${VIETMAP_API_KEY:?VIETMAP_API_KEY is required}
    REVALIDATE_SECRET: ${REVALIDATE_SECRET:?REVALIDATE_SECRET is required}
    ENABLE_ORDERING: ${ENABLE_ORDERING:-true}
    ENABLE_PAYMENT: ${ENABLE_PAYMENT:-true}
    ENABLE_EXTERNAL_SERVICES: ${ENABLE_EXTERNAL_SERVICES:-true}
  healthcheck:
    test:
      [
        'CMD',
        'node',
        '-e',
        "fetch('http://127.0.0.1:3000/robots.txt').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      ]
    interval: 15s
    timeout: 5s
    retries: 5
    start_period: 30s

services:
  hoatheomua-fe-demo:
    <<: *hoatheomua-fe-base
    container_name: hoatheomua-fe-demo
    hostname: hoatheomua-fe-demo
    networks: [hoatheomua-network-dev]
    profiles: [demo, hoatheomua-fe-demo, hoatheomua-fe]

  hoatheomua-fe-prod:
    <<: *hoatheomua-fe-base
    container_name: hoatheomua-fe-prod
    hostname: hoatheomua-fe-prod
    networks: [hoatheomua-network-prod]
    profiles: [prod, hoatheomua-fe-prod, hoatheomua-fe]

secrets:
  sentry_auth_token:
    environment: SENTRY_AUTH_TOKEN

networks:
  hoatheomua-network-dev:
    name: hoatheomua-network-dev
    external: true
  hoatheomua-network-prod:
    name: hoatheomua-network-prod
    external: true
